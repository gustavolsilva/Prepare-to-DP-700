<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow12" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="540" fill="#0b1120"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="920" height="42" fill="#002447"/>
  <circle cx="24" cy="21" r="10" fill="#0078d4"/>
  <text x="24" y="25" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">F</text>
  <text x="44" y="26" font-size="13" font-weight="700" fill="#ffffff">Microsoft Fabric</text>
  <text x="175" y="25" font-size="12" fill="#64748b">/</text>
  <text x="190" y="25" font-size="12" fill="#cbd5e1">Fabric Capacity Metrics App</text>
  <text x="400" y="25" font-size="12" font-weight="700" fill="#f59e0b">Capacidade F64 • Análise de CU e Smoothing</text>

  <!-- Left: Metric Filters -->
  <rect x="0" y="42" width="220" height="498" fill="#0f172a" stroke-right="#1e293b"/>
  <rect x="0" y="42" width="220" height="34" fill="#162238"/>
  <text x="15" y="64" font-size="12" font-weight="700" fill="#38bdf8">CAPACIDADE &amp; PERÍODO</text>

  <g transform="translate(15, 90)">
    <rect x="0" y="0" width="190" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="12" y="22" font-size="10.5" fill="#94a3b8">Capacidade Selecionada:</text>
    <text x="12" y="42" font-size="12" font-weight="700" fill="#f8fafc">Premium F64 (64 CUs)</text>

    <rect x="0" y="75" width="190" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="12" y="97" font-size="10.5" fill="#94a3b8">Janela de Smoothing:</text>
    <text x="12" y="117" font-size="12" font-weight="700" fill="#38bdf8">Móvel de 24 Horas</text>

    <rect x="0" y="150" width="190" height="85" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="12" y="172" font-size="11" font-weight="700" fill="#a7f3d0">Status da Capacidade:</text>
    <text x="12" y="192" font-size="13" font-weight="800" fill="#ffffff">🟢 Saudável (68% CU)</text>
    <text x="12" y="212" font-size="10" fill="#ecfdf5">Sem Throttling ou Burnout</text>
  </g>

  <!-- Main: CU Consumption Chart & Smoothing Window -->
  <rect x="220" y="42" width="700" height="498" fill="#070d19"/>

  <g transform="translate(240, 60)">
    <!-- KPI Cards Row -->
    <g>
      <rect x="0" y="0" width="210" height="70" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="24" font-size="11" fill="#94a3b8">Consumo Máximo (Pico)</text>
      <text x="15" y="52" font-size="18" font-weight="700" fill="#ef4444">184% CU (Pico)</text>
    </g>
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="210" height="70" rx="8" fill="#0f172a" stroke="#0284c7"/>
      <text x="15" y="24" font-size="11" fill="#94a3b8">Consumo Smoothing (24h)</text>
      <text x="15" y="52" font-size="18" font-weight="700" fill="#38bdf8">68% CU (Normalizado)</text>
    </g>
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="210" height="70" rx="8" fill="#0f172a" stroke="#10b981"/>
      <text x="15" y="24" font-size="11" fill="#94a3b8">Tempo até Throttling</text>
      <text x="15" y="52" font-size="18" font-weight="700" fill="#10b981">Zero (Seguro)</text>
    </g>

    <!-- Gráfico Visual de Smoothing (24h Window) -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="660" height="230" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#f8fafc">Gráfico de Utilização de Capacidade: Picos de Carga vs Curva Suavizada (Smoothing)</text>
      
      <!-- Linha do Limite de 100% -->
      <line x1="40" y1="110" x2="530" y2="110" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
      <text x="535" y="114" font-size="10" font-weight="700" fill="#f59e0b">100% Limite F64</text>

      <!-- Linha do Limite de 200% -->
      <line x1="40" y1="60" x2="570" y2="60" stroke="#ef4444" stroke-width="1" stroke-dasharray="4" opacity="0.6"/>
      <text x="575" y="64" font-size="10" fill="#ef4444">200% Pico</text>

      <!-- Picos Instantâneos (Barras azuis escuras de Spark / Data Factory Jobs) -->
      <g fill="#1e3a5f" opacity="0.7">
        <rect x="70" y="140" width="16" height="60" rx="2"/>
        <rect x="110" y="50" width="22" height="150" rx="2" fill="#ef4444"/> <!-- Pico 184% -->
        <rect x="150" y="130" width="16" height="70" rx="2"/>
        <rect x="230" y="100" width="20" height="100" rx="2"/>
        <rect x="310" y="70" width="24" height="130" rx="2" fill="#f59e0b"/> <!-- Pico 140% -->
        <rect x="390" y="150" width="16" height="50" rx="2"/>
        <rect x="470" y="120" width="20" height="80" rx="2"/>
        <rect x="550" y="135" width="18" height="65" rx="2"/>
      </g>

      <!-- Curva Suavizada de 24 horas (Linha Verde Suave) -->
      <path d="M 40,165 Q 110,140 180,148 T 310,135 T 450,142 T 600,150" fill="none" stroke="#10b981" stroke-width="3.5"/>
      
      <!-- Legenda do Gráfico -->
      <g transform="translate(40, 205)">
        <rect x="0" y="0" width="12" height="12" fill="#ef4444" rx="2"/>
        <text x="18" y="10" font-size="10.5" fill="#cbd5e1">Pico Instantâneo (Excede 100%)</text>

        <line x1="220" y1="6" x2="245" y2="6" stroke="#10b981" stroke-width="3"/>
        <text x="255" y="10" font-size="10.5" fill="#a7f3d0">Curva Efetiva com Smoothing 24h (68% - Nunca Bloqueia)</text>
      </g>
    </g>

    <!-- Tabela de Top Operações Consumidoras de CU -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="660" height="130" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="20" font-size="11.5" font-weight="700" fill="#38bdf8">TOP WORKLOADS CONSUMIDORES DE CU NA JANELA ATUAL</text>

      <g transform="translate(15, 32)">
        <text x="0" y="16" font-size="11" fill="#f8fafc">1. Spark Notebook: Ingestao_Delta_Bronze (42% CU total) • Suavizado em 24h</text>
        <text x="0" y="38" font-size="11" fill="#f8fafc">2. Fabric Data Warehouse: DimCliente_MERGE_Job (28% CU total) • Operação Interativa</text>
        <text x="0" y="60" font-size="11" fill="#f8fafc">3. Eventstream: IoT_Telemetry_Stream_Engine (18% CU total) • Carga de Fundo Contínua</text>
        <text x="0" y="82" font-size="10.5" fill="#a7f3d0">💡 <tspan font-weight="bold">Regra DP-700:</tspan> Background amortiza em 24h; Interativo amortiza em 5 min.</text>
      </g>
    </g>
  </g>
</svg>
