<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="540" fill="#0b1120"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="920" height="42" fill="#002447"/>
  <circle cx="24" cy="21" r="10" fill="#0078d4"/>
  <text x="24" y="25" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">F</text>
  <text x="44" y="26" font-size="13" font-weight="700" fill="#ffffff">Microsoft Fabric</text>
  <text x="175" y="25" font-size="12" fill="#64748b">/</text>
  <text x="190" y="25" font-size="12" fill="#cbd5e1">DP-700-Workspace</text>
  <text x="320" y="25" font-size="12" fill="#64748b">/</text>
  <text x="335" y="25" font-size="12" font-weight="700" fill="#38bdf8">es_iot_telemetry_stream</text>

  <!-- Toolbar -->
  <rect x="0" y="42" width="920" height="40" fill="#111f38" stroke-bottom="#1e293b"/>
  <rect x="15" y="48" width="130" height="28" rx="5" fill="#0284c7"/>
  <text x="80" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">+ Nova fonte  ▾</text>
  <rect x="155" y="48" width="140" height="28" rx="5" fill="#064e3b" stroke="#10b981"/>
  <text x="225" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#a7f3d0">+ Novo destino  ▾</text>

  <!-- Canvas do Eventstream (Fluxo de Baixa Latência) -->
  <rect x="0" y="82" width="920" height="458" fill="#070d19"/>

  <!-- Linhas Conectoras de Streaming (Animadas conceitualmente com setas) -->
  <line x1="260" y1="200" x2="380" y2="200" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6"/>
  <polygon points="380,200 370,193 370,207" fill="#f59e0b"/>

  <line x1="560" y1="170" x2="680" y2="150" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6"/>
  <polygon points="680,150 670,143 670,157" fill="#38bdf8"/>

  <line x1="560" y1="230" x2="680" y2="260" stroke="#10b981" stroke-width="4" stroke-dasharray="6"/>
  <polygon points="680,260 670,253 670,267" fill="#10b981"/>

  <!-- Bloco 1: Fonte (Fonte Personalizada / IoT Hub / Kafka) -->
  <g transform="translate(60, 150)" filter="url(#shadow7)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="25" cy="28" r="14" fill="#f59e0b"/>
    <text x="25" y="34" text-anchor="middle" font-size="14">📡</text>
    <text x="50" y="32" font-size="13" font-weight="700" fill="#ffffff">Azure Event Hub</text>
    <text x="15" y="58" font-size="11" fill="#cbd5e1">Topico: iot-sensor-telemetry</text>
    <text x="15" y="78" font-size="10.5" font-family="monospace" fill="#f59e0b">Taxa: ~12.500 msgs/seg</text>
  </g>

  <!-- Bloco 2: Transformação (Filtro e Janela Deslizante de 1 Minuto) -->
  <g transform="translate(380, 150)" filter="url(#shadow7)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <circle cx="25" cy="28" r="14" fill="#0284c7"/>
    <text x="25" y="34" text-anchor="middle" font-size="14">⚙️</text>
    <text x="50" y="32" font-size="13" font-weight="700" fill="#ffffff">Filter &amp; Aggregate</text>
    <text x="15" y="58" font-size="11" fill="#cbd5e1">Filtro: Temperatura &gt; 80°C</text>
    <text x="15" y="78" font-size="10.5" fill="#38bdf8">Janela: Tumbling (1 min)</text>
  </g>

  <!-- Destino 1: KQL Eventhouse (Alertas em tempo real) -->
  <g transform="translate(680, 100)" filter="url(#shadow7)">
    <rect x="0" y="0" width="200" height="85" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="25" cy="28" r="14" fill="#38bdf8"/>
    <text x="25" y="34" text-anchor="middle" font-size="14">⚡</text>
    <text x="50" y="32" font-size="13" font-weight="700" fill="#ffffff">KQL Eventhouse</text>
    <text x="15" y="58" font-size="10.5" fill="#cbd5e1">Tabela: RawSensorAlerts</text>
    <text x="15" y="74" font-size="10" fill="#a7f3d0">Latência: Subsegundo (In-Memory)</text>
  </g>

  <!-- Destino 2: Lakehouse (Delta Parquet para histórico analítico) -->
  <g transform="translate(680, 220)" filter="url(#shadow7)">
    <rect x="0" y="0" width="200" height="85" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <circle cx="25" cy="28" r="14" fill="#10b981"/>
    <text x="25" y="34" text-anchor="middle" font-size="14">🌊</text>
    <text x="50" y="32" font-size="13" font-weight="700" fill="#ffffff">Lakehouse Bronze</text>
    <text x="15" y="58" font-size="10.5" fill="#cbd5e1">Tabela: bronze_telemetria_delta</text>
    <text x="15" y="74" font-size="10" fill="#7dd3fc">Formato: Delta Lake com V-Order</text>
  </g>

  <!-- Pré-visualização de Dados em Tempo Real (Data Preview Tab) -->
  <g transform="translate(20, 360)">
    <rect x="0" y="0" width="880" height="160" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="0" width="880" height="28" rx="8" fill="#162238"/>
    <text x="15" y="19" font-size="11.5" font-weight="700" fill="#f59e0b">PRÉ-VISUALIZAÇÃO AO VIVO DOS EVENTOS (STREAMING BUFFER)</text>
    <text x="640" y="19" font-size="10.5" fill="#10b981">● Conectado (12.458 eventos)</text>

    <!-- Linhas de Amostra JSON dos Eventos -->
    <g transform="translate(15, 38)">
      <text x="0" y="18" font-family="Courier, monospace" font-size="11" fill="#cbd5e1">{"DeviceId": "TURBINE-09", "Temp": 84.5, "RPM": 3200, "Timestamp": "2026-11-13T14:32:01.120Z"}</text>
      <text x="0" y="42" font-family="Courier, monospace" font-size="11" fill="#cbd5e1">{"DeviceId": "TURBINE-12", "Temp": 89.2, "RPM": 3410, "Timestamp": "2026-11-13T14:32:01.145Z"} <tspan fill="#ea580c" font-weight="bold">[ALERTA]</tspan></text>
      <text x="0" y="66" font-family="Courier, monospace" font-size="11" fill="#cbd5e1">{"DeviceId": "TURBINE-04", "Temp": 76.1, "RPM": 2980, "Timestamp": "2026-11-13T14:32:01.210Z"}</text>
      <text x="0" y="90" font-family="Courier, monospace" font-size="11" fill="#cbd5e1">{"DeviceId": "TURBINE-08", "Temp": 81.0, "RPM": 3150, "Timestamp": "2026-11-13T14:32:01.290Z"}</text>
    </g>
  </g>
</svg>
