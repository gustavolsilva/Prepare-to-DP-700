<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="540" fill="#0b1120"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="920" height="42" fill="#002447"/>
  <circle cx="24" cy="21" r="10" fill="#0078d4"/>
  <text x="24" y="25" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">F</text>
  <text x="44" y="26" font-size="13" font-weight="700" fill="#ffffff">Microsoft Fabric</text>
  <text x="175" y="25" font-size="12" fill="#64748b">/</text>
  <text x="190" y="25" font-size="12" fill="#cbd5e1">DP-700-Workspace</text>
  <text x="320" y="25" font-size="12" fill="#64748b">/</text>
  <text x="335" y="25" font-size="12" font-weight="700" fill="#38bdf8">pl_daily_enterprise_etl</text>

  <!-- Toolbar -->
  <rect x="0" y="42" width="920" height="40" fill="#111f38" stroke-bottom="#1e293b"/>
  <rect x="15" y="48" width="95" height="28" rx="5" fill="#0284c7"/>
  <text x="62" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">▶ Depurar</text>
  <rect x="120" y="48" width="115" height="28" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="177" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">⏱️ Agendamento</text>

  <!-- Left Activities Bar -->
  <rect x="0" y="82" width="200" height="458" fill="#0f172a" stroke-right="#1e293b"/>
  <rect x="0" y="82" width="200" height="34" fill="#162238"/>
  <text x="15" y="104" font-size="12" font-weight="700" fill="#38bdf8">ATIVIDADES DO PIPELINE</text>
  
  <g transform="translate(15, 130)">
    <rect x="0" y="0" width="170" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="23" font-size="13">📋</text>
    <text x="30" y="23" font-size="11.5" fill="#cbd5e1">Copiar dados (Fast Copy)</text>
  </g>
  <g transform="translate(15, 175)">
    <rect x="0" y="0" width="170" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="23" font-size="13">⚡</text>
    <text x="30" y="23" font-size="11.5" fill="#cbd5e1">Dataflow Gen2</text>
  </g>
  <g transform="translate(15, 220)">
    <rect x="0" y="0" width="170" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="23" font-size="13">📓</text>
    <text x="30" y="23" font-size="11.5" fill="#cbd5e1">Spark Notebook</text>
  </g>

  <!-- Canvas do Pipeline (Grafo Direcionado Acíclico - DAG) -->
  <rect x="200" y="82" width="720" height="458" fill="#070d19"/>

  <!-- Grid de fundo simulado -->
  <g stroke="#162238" stroke-width="1" opacity="0.3">
    <line x1="200" y1="140" x2="920" y2="140"/>
    <line x1="200" y1="200" x2="920" y2="200"/>
    <line x1="200" y1="260" x2="920" y2="260"/>
    <line x1="200" y1="320" x2="920" y2="320"/>
    <line x1="300" y1="82" x2="300" y2="540"/>
    <line x1="450" y1="82" x2="450" y2="540"/>
    <line x1="600" y1="82" x2="600" y2="540"/>
    <line x1="750" y1="82" x2="750" y2="540"/>
  </g>

  <!-- Linhas Conectoras do DAG com status de sucesso -->
  <line x1="390" y1="180" x2="460" y2="180" stroke="#10b981" stroke-width="3"/>
  <polygon points="460,180 452,175 452,185" fill="#10b981"/>

  <line x1="610" y1="180" x2="680" y2="180" stroke="#10b981" stroke-width="3"/>
  <polygon points="680,180 672,175 672,185" fill="#10b981"/>

  <!-- Atividade 1: Copy Data (Fast Copy para Camada Bronze) -->
  <g transform="translate(240, 140)" filter="url(#shadow6)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="135" cy="15" r="7" fill="#10b981"/>
    <text x="135" y="19" text-anchor="middle" font-size="9" fill="#ffffff">✓</text>
    <text x="15" y="28" font-size="14">📋</text>
    <text x="40" y="28" font-size="12" font-weight="700" fill="#f8fafc">Copy Data</text>
    <text x="15" y="52" font-size="10.5" fill="#38bdf8">Origem: SQL On-Prem</text>
    <text x="15" y="68" font-size="10" fill="#94a3b8">Destino: Bronze Lakehouse</text>
  </g>

  <!-- Atividade 2: Dataflow Gen2 (Limpeza Camada Silver) -->
  <g transform="translate(460, 140)" filter="url(#shadow6)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="135" cy="15" r="7" fill="#10b981"/>
    <text x="135" y="19" text-anchor="middle" font-size="9" fill="#ffffff">✓</text>
    <text x="15" y="28" font-size="14">⚡</text>
    <text x="40" y="28" font-size="12" font-weight="700" fill="#f8fafc">Dataflow Gen2</text>
    <text x="15" y="52" font-size="10.5" fill="#38bdf8">Power Query Gen2</text>
    <text x="15" y="68" font-size="10" fill="#94a3b8">Destino: Silver Delta</text>
  </g>

  <!-- Atividade 3: Notebook Spark (Agregação Camada Gold) -->
  <g transform="translate(680, 140)" filter="url(#shadow6)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="145" cy="15" r="7" fill="#38bdf8"/>
    <text x="145" y="19" text-anchor="middle" font-size="9" fill="#ffffff">⏳</text>
    <text x="15" y="28" font-size="14">📓</text>
    <text x="40" y="28" font-size="12" font-weight="700" fill="#ffffff">Spark Gold Agg</text>
    <text x="15" y="52" font-size="10.5" fill="#7dd3fc">Notebook PySpark</text>
    <text x="15" y="68" font-size="10" fill="#cbd5e1">Destino: Gold Delta</text>
  </g>

  <!-- Painel Inferior de Saída da Execução (Output Tab) -->
  <g transform="translate(220, 290)">
    <rect x="0" y="0" width="680" height="230" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="0" width="680" height="32" rx="8" fill="#162238"/>
    <text x="15" y="21" font-size="12" font-weight="700" fill="#38bdf8">HISTÓRICO DE EXECUÇÃO DO PIPELINE</text>
    
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="650" height="28" rx="4" fill="#1e293b"/>
      <text x="15" y="18" font-size="11" font-weight="700" fill="#cbd5e1">Nome da Atividade</text>
      <text x="220" y="18" font-size="11" font-weight="700" fill="#cbd5e1">Status</text>
      <text x="380" y="18" font-size="11" font-weight="700" fill="#cbd5e1">Duração</text>
      <text x="500" y="18" font-size="11" font-weight="700" fill="#cbd5e1">Linhas Processadas</text>

      <g transform="translate(0, 34)">
        <text x="15" y="19" font-size="11.5" fill="#f8fafc">Copy Data</text>
        <text x="220" y="19" font-size="11.5" font-weight="700" fill="#10b981">● Êxito</text>
        <text x="380" y="19" font-size="11.5" fill="#94a3b8">00:01:24</text>
        <text x="500" y="19" font-size="11.5" font-family="monospace" fill="#34d399">1.250.000 linhas</text>
      </g>

      <g transform="translate(0, 68)">
        <text x="15" y="19" font-size="11.5" fill="#f8fafc">Dataflow Gen2</text>
        <text x="220" y="19" font-size="11.5" font-weight="700" fill="#10b981">● Êxito</text>
        <text x="380" y="19" font-size="11.5" fill="#94a3b8">00:03:12</text>
        <text x="500" y="19" font-size="11.5" font-family="monospace" fill="#34d399">1.248.910 linhas</text>
      </g>
    </g>
  </g>
</svg>
