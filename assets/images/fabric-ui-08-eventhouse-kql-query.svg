<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="540" fill="#0b1120"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="920" height="42" fill="#002447"/>
  <circle cx="24" cy="21" r="10" fill="#0078d4"/>
  <text x="24" y="25" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">F</text>
  <text x="44" y="26" font-size="13" font-weight="700" fill="#ffffff">Microsoft Fabric</text>
  <text x="175" y="25" font-size="12" fill="#64748b">/</text>
  <text x="190" y="25" font-size="12" fill="#cbd5e1">DP-700-Workspace</text>
  <text x="320" y="25" font-size="12" fill="#64748b">/</text>
  <text x="335" y="25" font-size="12" font-weight="700" fill="#38bdf8">evh_iot_telemetry_kql</text>

  <!-- Left Sidebar: KQL Database Explorer -->
  <rect x="0" y="42" width="220" height="498" fill="#0f172a" stroke-right="#1e293b"/>
  <rect x="0" y="42" width="220" height="34" fill="#162238"/>
  <text x="15" y="64" font-size="12" font-weight="700" fill="#38bdf8">KQL DATABASE EXPLORER</text>
  
  <g transform="translate(10, 85)">
    <text x="0" y="14" font-size="13">⚡</text>
    <text x="22" y="14" font-size="12" font-weight="700" fill="#f8fafc">evh_iot_telemetry</text>
    <g transform="translate(15, 24)">
      <text x="0" y="14" font-size="12">📂</text>
      <text x="18" y="14" font-size="11.5" fill="#cbd5e1">Tables</text>
      <g transform="translate(15, 22)">
        <text x="0" y="14" font-size="11">📋</text>
        <text x="16" y="14" font-size="11" fill="#cbd5e1">RawTelemetry (Bronze)</text>
      </g>
      <g transform="translate(15, 46)">
        <rect x="-4" y="-2" width="165" height="24" rx="4" fill="#0c4a6e"/>
        <text x="0" y="14" font-size="11">⚡</text>
        <text x="16" y="14" font-size="11" font-weight="700" fill="#38bdf8">AggregatedSensors1m</text>
      </g>
    </g>
    <g transform="translate(15, 105)">
      <text x="0" y="14" font-size="12">📜</text>
      <text x="18" y="14" font-size="11.5" fill="#f59e0b">Update Policies (1 ativa)</text>
    </g>
  </g>

  <!-- Action Bar -->
  <rect x="220" y="42" width="700" height="40" fill="#111f38" stroke-bottom="#1e293b"/>
  <rect x="235" y="48" width="95" height="28" rx="5" fill="#0284c7"/>
  <text x="282" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">▶ Executar</text>
  <rect x="340" y="48" width="115" height="28" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="397" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">📊 Visualização</text>

  <!-- KQL Query Editor -->
  <rect x="220" y="82" width="700" height="458" fill="#070d19"/>

  <g transform="translate(235, 95)">
    <rect x="0" y="0" width="670" height="175" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="30" height="175" rx="8" fill="#162238"/>
    <text x="15" y="24" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">1</text>
    <text x="15" y="46" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">2</text>
    <text x="15" y="68" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">3</text>
    <text x="15" y="90" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">4</text>
    <text x="15" y="112" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">5</text>
    <text x="15" y="134" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">6</text>
    <text x="15" y="156" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">7</text>

    <!-- KQL Query Syntax -->
    <text x="45" y="24" font-family="Courier, monospace" font-size="12" font-weight="700" fill="#38bdf8">RawTelemetry</text>
    <text x="45" y="46" font-family="Courier, monospace" font-size="12" fill="#f8fafc">| <tspan fill="#0284c7" font-weight="bold">where</tspan> Timestamp &gt; <tspan fill="#f59e0b">ago(1h)</tspan> <tspan fill="#0284c7" font-weight="bold">and</tspan> Temperature &gt; 80.0</text>
    <text x="45" y="68" font-family="Courier, monospace" font-size="12" fill="#f8fafc">| <tspan fill="#0284c7" font-weight="bold">summarize</tspan></text>
    <text x="65" y="90" font-family="Courier, monospace" font-size="12" fill="#cbd5e1">AvgTemp = <tspan fill="#34d399">avg(Temperature)</tspan>, MaxTemp = <tspan fill="#34d399">max(Temperature)</tspan>, EventCount = <tspan fill="#34d399">count()</tspan></text>
    <text x="65" y="112" font-family="Courier, monospace" font-size="12" fill="#0284c7" font-weight="bold">by <tspan fill="#cbd5e1">bin(Timestamp, 5m), DeviceId</tspan></text>
    <text x="45" y="134" font-family="Courier, monospace" font-size="12" fill="#f8fafc">| <tspan fill="#0284c7" font-weight="bold">top 10 by</tspan> MaxTemp <tspan fill="#0284c7" font-weight="bold">desc</tspan></text>
  </g>

  <!-- KQL Results Grid -->
  <g transform="translate(235, 285)">
    <rect x="0" y="0" width="670" height="240" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="0" width="670" height="30" rx="8" fill="#162238"/>
    <text x="15" y="20" font-size="11.5" font-weight="700" fill="#38bdf8">RESULTADO KQL (Tempo de Varredura: 28ms sobre 480.000 registros)</text>

    <g transform="translate(15, 42)">
      <rect x="0" y="0" width="640" height="24" rx="4" fill="#1e293b"/>
      <text x="15" y="16" font-size="11" font-weight="700" fill="#cbd5e1">Timestamp (Bin 5m)</text>
      <text x="190" y="16" font-size="11" font-weight="700" fill="#cbd5e1">DeviceId</text>
      <text x="320" y="16" font-size="11" font-weight="700" fill="#cbd5e1">AvgTemp (°C)</text>
      <text x="460" y="16" font-size="11" font-weight="700" fill="#cbd5e1">MaxTemp (°C)</text>
      <text x="570" y="16" font-size="11" font-weight="700" fill="#cbd5e1">Count</text>

      <g transform="translate(0, 30)">
        <text x="15" y="18" font-family="Courier, monospace" font-size="11" fill="#cbd5e1">2026-11-13 14:25:00</text>
        <text x="190" y="18" font-size="11" font-weight="700" fill="#f8fafc">TURBINE-12</text>
        <text x="320" y="18" font-family="Courier, monospace" font-size="11" fill="#cbd5e1">88.4</text>
        <text x="460" y="18" font-family="Courier, monospace" font-size="11" font-weight="700" fill="#ef4444">94.1</text>
        <text x="570" y="18" font-family="Courier, monospace" font-size="11" fill="#38bdf8">1.450</text>
      </g>
      <g transform="translate(0, 58)">
        <text x="15" y="18" font-family="Courier, monospace" font-size="11" fill="#cbd5e1">2026-11-13 14:20:00</text>
        <text x="190" y="18" font-size="11" font-weight="700" fill="#f8fafc">TURBINE-09</text>
        <text x="320" y="18" font-family="Courier, monospace" font-size="11" fill="#cbd5e1">85.2</text>
        <text x="460" y="18" font-family="Courier, monospace" font-size="11" font-weight="700" fill="#f59e0b">89.8</text>
        <text x="570" y="18" font-family="Courier, monospace" font-size="11" fill="#38bdf8">1.390</text>
      </g>
    </g>

    <!-- Chamada Visual 8: Destaque de Desempenho KQL -->
    <g transform="translate(355, 175)">
      <rect x="0" y="0" width="300" height="42" rx="8" fill="#0c4a6e" stroke="#38bdf8" filter="url(#shadow8)"/>
      <text x="12" y="18" font-size="11" font-weight="800" fill="#ffffff">DESTAQUE DP-700: KQL EVENTHOUSE</text>
      <text x="12" y="32" font-size="10.5" fill="#7dd3fc">Indexação total de strings e motor colunar vetorial</text>
    </g>
  </g>
</svg>
