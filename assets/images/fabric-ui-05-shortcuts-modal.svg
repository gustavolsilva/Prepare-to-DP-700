<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="540" fill="#0b1120"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="920" height="42" fill="#002447"/>
  <circle cx="24" cy="21" r="10" fill="#0078d4"/>
  <text x="24" y="25" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">F</text>
  <text x="44" y="26" font-size="13" font-weight="700" fill="#ffffff">Microsoft Fabric</text>
  <text x="175" y="25" font-size="12" fill="#64748b">/</text>
  <text x="190" y="25" font-size="12" fill="#cbd5e1">lh_global_enterprise</text>

  <!-- Background Lakehouse Structure -->
  <rect x="20" y="60" width="260" height="460" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="35" y="88" font-size="13" font-weight="700" fill="#38bdf8">OneLake Explorer</text>
  <text x="35" y="120" font-size="12" fill="#f8fafc">🌊 lh_global_enterprise</text>
  <text x="55" y="145" font-size="11.5" fill="#cbd5e1">📂 Tables</text>
  <text x="75" y="170" font-size="11" fill="#38bdf8">🔗 s3_raw_telemetry (Atalho S3)</text>
  <text x="75" y="195" font-size="11" fill="#10b981">🔗 adls_customer_lake (ADLS)</text>
  <text x="75" y="220" font-size="11" fill="#f59e0b">🔗 dataverse_crm_accounts</text>

  <!-- Modal Central: New Shortcut Wizard (Zero-Copy) -->
  <g filter="url(#shadow5)">
    <rect x="240" y="70" width="640" height="430" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <text x="270" y="110" font-size="18" font-weight="700" fill="#f8fafc">Novo Atalho (New Shortcut) no OneLake</text>
    <text x="845" y="110" font-size="16" fill="#94a3b8" cursor="pointer">✕</text>
    
    <text x="270" y="138" font-size="12" fill="#94a3b8">Selecione a fonte externa para conectar dados sem cópia física (Zero-Copy Architecture).</text>

    <!-- Fontes Internas -->
    <text x="270" y="175" font-size="12" font-weight="700" fill="#38bdf8">FONTES INTERNAS DO ONELAKE</text>
    <g transform="translate(270, 185)">
      <rect x="0" y="0" width="280" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="28" cy="38" r="16" fill="#0284c7"/>
      <text x="28" y="44" text-anchor="middle" font-size="16">🌊</text>
      <text x="56" y="32" font-size="13" font-weight="700" fill="#f8fafc">Microsoft OneLake</text>
      <text x="56" y="52" font-size="10.5" fill="#94a3b8">Compartilhe pastas de outro Lakehouse ou Warehouse</text>
    </g>

    <!-- Fontes Externas em Nuvem -->
    <text x="270" y="285" font-size="12" font-weight="700" fill="#38bdf8">FONTES EXTERNAS EM NUVEM (MULTI-CLOUD)</text>
    
    <!-- ADLS Gen2 -->
    <g transform="translate(270, 295)">
      <rect x="0" y="0" width="180" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="24" cy="30" r="14" fill="#0078d4"/>
      <text x="24" y="36" text-anchor="middle" font-size="14">☁️</text>
      <text x="46" y="34" font-size="12" font-weight="700" fill="#f8fafc">Azure Data Lake</text>
      <text x="14" y="62" font-size="10" fill="#94a3b8">Storage Gen2 com autenticação OAuth ou MSI</text>
    </g>

    <!-- Amazon S3 - SELECIONADO COM DESTAQUE -->
    <g transform="translate(465, 295)">
      <rect x="0" y="0" width="190" height="90" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="24" cy="30" r="14" fill="#ea580c"/>
      <text x="24" y="36" text-anchor="middle" font-size="14">📦</text>
      <text x="46" y="34" font-size="12" font-weight="700" fill="#ffffff">Amazon S3</text>
      <text x="14" y="62" font-size="10" fill="#7dd3fc">Buckets AWS S3 usando IAM Role ou Access Key</text>
      <circle cx="170" cy="20" r="6" fill="#38bdf8"/>
    </g>

    <!-- Dataverse -->
    <g transform="translate(670, 295)">
      <rect x="0" y="0" width="180" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="24" cy="30" r="14" fill="#059669"/>
      <text x="24" y="36" text-anchor="middle" font-size="14">⚡</text>
      <text x="46" y="34" font-size="12" font-weight="700" fill="#f8fafc">Dataverse</text>
      <text x="14" y="62" font-size="10" fill="#94a3b8">Dynamics 365 e Power Apps direto no lago</text>
    </g>

    <!-- Rodapé do Modal -->
    <rect x="240" y="420" width="640" height="80" rx="14" fill="#162238"/>
    <text x="265" y="452" font-size="11" fill="#a7f3d0">💡 <tspan font-weight="bold">Zero Movimentação:</tspan> O Fabric consulta os dados</text>
    <text x="282" y="468" font-size="11" fill="#a7f3d0">diretamente do bucket AWS ou storage externo.</text>
    <rect x="750" y="440" width="110" height="34" rx="6" fill="#0284c7" stroke="#38bdf8"/>
    <text x="805" y="462" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Avançar →</text>
  </g>
</svg>
